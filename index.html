<meta charset="UTF-8">

<title>Birlikte Büyüyen Bir Lale</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#f7f0e8;color:#49403c;font-family:Georgia,serif}
#scene{width:100%;height:100%;position:relative;overflow:hidden}
.paper{
 position:absolute;inset:0;
 background-color:#f7f0e8;
 background-image:radial-gradient(#c9b8a4 .65px,transparent .65px);
 background-size:9px 9px;
}
header{position:absolute;top:5%;width:100%;text-align:center;z-index:5}
header small{font:italic 12px Georgia;letter-spacing:4px;color:#a28b7d}
h1{font-weight:400;font-size:clamp(22px,5vw,38px);margin:10px 0}
#chapter{font-size:13px;color:#9a8177;letter-spacing:1px}
svg{position:absolute;inset:0;width:100%;height:100%}
.sketch{fill:none;stroke:#64564f;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.light{stroke:#a38a7b;stroke-width:1.4}
.plant{fill:none;stroke:#71896c;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.petals{fill:#d99ca5;stroke:#765c61;stroke-width:1.5}
.person{transform-box:fill-box;transform-origin:center}
#man{animation:manBreath 4s ease-in-out infinite}
#woman{animation:womanBreath 4.4s ease-in-out infinite}
@keyframes manBreath{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes womanBreath{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
#seed,#sprout,#stem,#leaves,#bud,#bloom,#rain,#umbrella,#watering,#finalFlowers{opacity:0}
#seed{opacity:1}
#sprout,#stem,#leaves,#bud,#bloom,#rain,#umbrella,#watering,#finalFlowers{transition:opacity 1.5s ease}
#soil{fill:#bca18b;opacity:.55}
#waterdrop{animation:drop 1.1s ease-in infinite}
@keyframes drop{0%{transform:translateY(-10px);opacity:0}30%{opacity:1}100%{transform:translateY(20px);opacity:0}}
#rain line{animation:rainfall .65s linear infinite}
#rain line:nth-child(2n){animation-delay:-.3s}
@keyframes rainfall{from{transform:translateY(-15px)}to{transform:translateY(40px)}}
#umbrella{transform-origin:50% 50%;transition:transform .8s ease}
#message{position:absolute;bottom:7%;width:100%;text-align:center;opacity:0;transition:opacity 2s ease;padding:0 20px}
#message strong{font-weight:400;font-size:clamp(25px,6vw,43px);color:#9c596b}
#message p{font-style:italic;font-size:14px;color:#927b70;line-height:1.8}
#restart{border:1px solid #c9b0a4;background:transparent;color:#80675d;padding:10px 18px;border-radius:30px;font:12px Georgia;cursor:pointer;margin-top:5px}
#hint{position:absolute;bottom:3%;width:100%;text-align:center;color:#aa9587;font:10px Georgia;letter-spacing:2px}
@media(max-height:600px){header{top:2%}h1{margin:5px 0}#message{bottom:2%}#hint{display:none}}
</style>
</head>

<script>
const $=id=>document.getElementById(id);
const chapter=$("chapter");
const parts=["seed","sprout","stem","leaves","bud","bloom","rain","umbrella","watering","finalFlowers"];
let timers=[];
function show(id,opacity=1){$(id).style.opacity=opacity}
function hide(id){show(id,0)}
function at(seconds,fn){timers.push(setTimeout(fn,seconds*1000))}
function startStory(){
 timers.forEach(clearTimeout);timers=[];
 parts.forEach(hide);
 hide("message");hide("petalDrift");
 show("seed");
 chapter.textContent="Her şey küçücük bir tohumla başladı.";
 at(3,()=>{
  chapter.textContent="Birlikte toprağa emanet ettiler.";
  $("seed").style.transform="translateY(2px)";
 });
 at(6,()=>{
  chapter.textContent="Sabırla beklediler. İlk filiz göründü.";
  show("sprout");
 });
 at(10,()=>{
  chapter.textContent="Biri tuttu, diğeri toprağı besledi.";
  show("stem");show("leaves");
  show("watering");
 });
 at(14,()=>{
  chapter.textContent="Birlikte suladılar; umut biraz daha büyüdü.";
  hide("watering");
  show("bud");
 });
 at(18,()=>{
  chapter.textContent="Sonra yağmur başladı.";
  show("rain");
 });
 at(21,()=>{
  chapter.textContent="Onu birlikte korudular.";
  show("umbrella");
 });
 at(26,()=>{
  chapter.textContent="Fırtına geçti. Güneş yeniden doğdu.";
  hide("rain");hide("umbrella");
 });
 at(29,()=>{
  chapter.textContent="Birlikte büyüttükleri şey artık çiçek açıyordu.";
  show("bloom");
 });
 at(33,()=>{
  chapter.textContent="Ve tek bir çiçek, koca bir bahçeye dönüştü.";
  show("finalFlowers");
  show("petalDrift");
  $("message").style.opacity=1;
  $("hint").style.opacity=0;
 });
}
startStory();
</script>
</body>
